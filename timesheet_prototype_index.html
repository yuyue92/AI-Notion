<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timesheet Management System — Static Prototype</title>
  <style>
    :root{
      --bg:#f4f7fb; --panel:#ffffff; --ink:#1f2937; --muted:#667085; --line:#d9e2ef;
      --brand:#0b5cab; --brand2:#0f7cc9; --soft:#eaf4ff; --green:#0f9f6e; --red:#d92d20; --amber:#b7791f;
      --purple:#6941c6; --shadow:0 12px 30px rgba(16,24,40,.10);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);}
    .topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px;position:sticky;top:0;z-index:10}
    .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:.4px}
    .product{font-size:18px;font-weight:750;line-height:1.1}.sub{font-size:12px;color:var(--muted);font-weight:500}.spacer{flex:1}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand);border:1px solid #c8e3ff}
    .avatar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.avatar .dot{width:32px;height:32px;border-radius:50%;background:#172554;color:white;display:grid;place-items:center;font-weight:800}
    .layout{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 64px)}
    .side{background:#0b1220;color:#cbd5e1;padding:18px 14px}.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin:18px 10px 8px}.nav{display:flex;flex-direction:column;gap:6px}.nav a{color:#cbd5e1;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center}.nav a.active,.nav a:hover{background:#172554;color:#fff}.nav .icon{width:19px;text-align:center}
    main{padding:26px 30px 40px}.page-head{display:flex;align-items:flex-start;margin-bottom:18px;gap:20px}.page-head h1{margin:0;font-size:27px;letter-spacing:-.02em}.page-head p{margin:6px 0 0;color:var(--muted);font-size:14px}.head-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .btn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:9px;padding:10px 14px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--brand);color:white;border-color:var(--brand)}.btn.danger{background:#fff;color:var(--red);border-color:#f3b6b0}.btn.ghost{background:#f8fafc}.btn:hover{filter:brightness(.98)}
    .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}.card.flat{box-shadow:none}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.four{grid-template-columns:repeat(4,1fr)}
    .field label{display:block;font-size:12px;color:#475467;font-weight:750;margin-bottom:7px}.input,.select,.textarea{width:100%;border:1px solid #cfd8e6;background:#fff;border-radius:9px;padding:10px 12px;font-size:14px;min-height:42px;color:#1f2937}.textarea{min-height:80px;resize:none}.hint{font-size:12px;color:var(--muted);margin-top:6px}.required{color:var(--red)}
    table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:#475467;font-weight:800;background:#f8fafc;border-bottom:1px solid var(--line);padding:12px}td{font-size:13px;padding:13px 12px;border-bottom:1px solid #edf2f7;color:#344054}.num{text-align:right}.status{font-size:12px;border-radius:999px;padding:5px 9px;font-weight:800;display:inline-block}.draft{background:#eef2f7;color:#475467}.pending{background:#fff7e6;color:#ad6800}.approved{background:#e8faf1;color:#087443}.rejected{background:#ffe8e5;color:#b42318}.locked{background:#eaf4ff;color:#0b5cab}.purple{background:#f4ebff;color:#6941c6}
    .daybar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:16px}.day{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer}.day.active{border-color:var(--brand);box-shadow:0 0 0 3px #d7ebff}.day .d{font-size:12px;font-weight:800;color:#475467}.day .h{font-size:24px;font-weight:850;margin-top:6px}.day .warn{color:var(--amber)}.day .ok{color:var(--green)}.day .zero{color:#98a2b3}
    .summary-stat{border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px}.summary-stat .label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}.summary-stat .value{font-size:30px;font-weight:850;margin-top:6px;color:#111827}.summary-stat .small{font-size:12px;color:var(--muted);margin-top:4px}
    .signin-wrap{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:40px;background:radial-gradient(circle at top left,#dff0ff,transparent 38%),linear-gradient(145deg,#f4f7fb,#edf3fb)}.signin{width:440px}.center{text-align:center}.brand-mark{width:74px;height:74px;border-radius:20px;background:linear-gradient(145deg,var(--brand),var(--brand2));margin:0 auto 18px;display:grid;place-items:center;color:white;font-size:28px;font-weight:900}.login-title{font-size:28px;font-weight:850;margin:0}.login-sub{color:var(--muted);font-size:14px;margin:8px 0 24px}.footer-note{font-size:12px;color:#667085;text-align:center;margin-top:18px}
    .route{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.route .node{font-size:12px;font-weight:800;color:#0b5cab;background:#eaf4ff;border:1px solid #c8e3ff;border-radius:999px;padding:6px 10px}.route .arrow{color:#667085}.progress{display:flex;gap:10px;align-items:center}.step{display:flex;align-items:center;gap:8px;color:#667085;font-weight:700;font-size:13px}.step .circle{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid #cbd5e1;background:#fff;font-size:11px}.step.done{color:#087443}.step.done .circle{background:#e8faf1;border-color:#12b76a;color:#087443}.step.current{color:#0b5cab}.step.current .circle{background:#eaf4ff;border-color:#0b5cab;color:#0b5cab}
    .ticket-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:#fff;cursor:pointer}.ticket-card:hover,.ticket-card.selected{border-color:var(--brand);box-shadow:0 0 0 3px #eaf4ff}.ticket-title{font-weight:800}.ticket-meta{font-size:12px;color:var(--muted);margin-top:4px}.split{display:grid;grid-template-columns:320px 1fr;gap:18px}.tree{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.tree ul{list-style:none;margin:0;padding-left:18px}.tree li{padding:7px 0;font-size:14px}.tree .active{font-weight:850;color:var(--brand)}.drawer{border-left:1px solid var(--line);background:#fff;padding:20px;box-shadow:-10px 0 24px rgba(16,24,40,.06)}
    .bar{height:18px;background:#e7eef8;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px}.chart-row{display:grid;grid-template-columns:170px 1fr 70px;gap:14px;align-items:center;margin:14px 0;font-size:13px}.notice{border:1px solid #fedf89;background:#fffbeb;color:#92400e;border-radius:12px;padding:12px;font-size:13px}.modal-screen{max-width:1020px;margin:0 auto}.kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f2f4f7;border-radius:6px;padding:2px 6px;border:1px solid #d0d5dd}.sponsor-note{font-size:12px;color:#475467;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin-top:14px}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:none}.grid.four,.grid.three,.grid.two{grid-template-columns:1fr}.split{grid-template-columns:1fr}.head-actions{margin-left:0}.page-head{flex-direction:column}.daybar{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div id="app"></div>
<script>
const pages = [
  ['signin','Sign In','🔐'],['timesheet','My Timesheet','🗓️'],['add-entry','Add / Edit Entry','➕'],['submit','Submit Timesheet','📤'],['approvals','Approval Inbox','✅'],['approval-detail','Approval Detail','🔎'],['report','Project Hours Report','📊'],['organisation','Organisation & Users','🏢']
];
const state = { selectedDay: 'mon' };
function route(){ return (location.hash || '#/signin').replace('#/','') || 'signin'; }
function go(id){ location.hash = '#/' + id; }
window.addEventListener('hashchange', render);
function appShell(content){
  const current = route();
  if(current==='signin') return `<div class="topbar"><div class="logo">TS</div><div><div class="product">Timesheet Management System</div><div class="sub">Internal Staff Portal</div></div><div class="spacer"></div><span class="pill">Static clickable prototype</span></div>${content}`;
  return `<div class="topbar"><div class="logo">TS</div><div><div class="product">Timesheet Management System</div><div class="sub">Internal Staff Portal</div></div><div class="spacer"></div><span class="pill">DD/MM/YYYY</span><div class="avatar"><div class="dot">CW</div><div>Chris Wong ▼</div></div></div><div class="layout"><aside class="side"><div class="nav-title">Main Menu</div><nav class="nav">${pages.filter(p=>p[0]!=='signin').map(p=>`<a href="#/${p[0]}" class="${current===p[0]?'active':''}"><span class="icon">${p[2]}</span>${p[1]}</a>`).join('')}</nav><div class="nav-title">Prototype Notes</div><div style="font-size:12px;line-height:1.5;color:#94a3b8;padding:0 10px">Mock data only. No database or Jira connection. Click menu items, buttons and review links to navigate.</div></aside><main>${content}</main></div>`;
}
function pageHead(title, desc, actions=''){ return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`; }
function signin(){ return appShell(`<div class="signin-wrap"><div class="signin card"><div class="center"><div class="brand-mark">TS</div><h1 class="login-title">Timesheet Management System</h1><div class="login-sub">Internal Staff Portal</div></div><div class="field"><label>Company Email</label><input class="input" value="chris.wong@company.com" /></div><br/><div class="field"><label>Password</label><input type="password" class="input" value="password" /></div><br/><label style="font-size:13px;color:#475467"><input type="checkbox"/> Remember me</label><br/><br/><button class="btn primary" style="width:100%;justify-content:center" onclick="go('timesheet')">Sign In</button><div class="footer-note">For internal use only · Forgot password?</div></div></div>`); }
function timesheet(){
  return appShell(`${pageHead('My Timesheet','Record and submit your weekly working hours.',`<button class="btn ghost" onclick="go('submit')">Submit Week</button><button class="btn primary" onclick="go('add-entry')">+ Add Time Entry</button>`)}<div class="card"><div style="display:flex;align-items:center;gap:14px"><button class="btn">‹ Previous Week</button><div style="font-weight:850;font-size:18px">01/06/2026 - 07/06/2026</div><button class="btn">Next Week ›</button><div class="spacer"></div><span class="status draft">Draft</span><span class="pill">Weekly Total: 38.5 / 40 Hours</span></div><div class="daybar">${[['mon','Mon 01 Jun','8.0h','ok'],['tue','Tue 02 Jun','7.5h','warn'],['wed','Wed 03 Jun','8.0h','ok'],['thu','Thu 04 Jun','7.0h','warn'],['fri','Fri 05 Jun','8.0h','ok'],['sat','Sat 06 Jun','0.0h','zero'],['sun','Sun 07 Jun','0.0h','zero']].map(d=>`<div class="day ${d[0]==='mon'?'active':''}" onclick="state.selectedDay='${d[0]}';render()"><div class="d">${d[1]}</div><div class="h ${d[3]}">${d[2]}</div></div>`).join('')}</div></div><br/><div class="card"><div style="display:flex;align-items:center;margin-bottom:12px"><div><b>Entries for Monday, 01/06/2026</b><div class="hint">Click a row to edit the entry.</div></div><div class="spacer"></div><button class="btn" onclick="go('add-entry')">+ Add Time Entry</button></div>${entriesTable()}<div style="display:flex;align-items:center;margin-top:16px"><b>Total for selected day: 8.0 Hours</b><div class="spacer"></div><button class="btn">Copy Previous Day</button><button class="btn">Copy Selected Entry</button><button class="btn primary" onclick="go('submit')">Submit Week</button></div></div>`);
}
function entriesTable(){ return `<table><thead><tr><th>Project</th><th>Role</th><th>Work Type</th><th>Task Nature</th><th>Module</th><th>Ticket</th><th class="num">Hours</th><th>Action</th></tr></thead><tbody><tr onclick="go('add-entry')"><td>Core CRM</td><td>Developer</td><td>Project</td><td>Development</td><td>Billing</td><td><span class="kbd">CRM-21</span></td><td class="num">4.0</td><td>Edit</td></tr><tr onclick="go('add-entry')"><td>Core CRM</td><td>Developer</td><td>Project</td><td>Bug Fix</td><td>Billing</td><td><span class="kbd">CRM-35</span></td><td class="num">2.5</td><td>Edit</td></tr><tr onclick="go('add-entry')"><td>Internal</td><td>Developer</td><td>Internal</td><td>Meeting</td><td>General</td><td>—</td><td class="num">1.5</td><td>Edit</td></tr></tbody></table>`; }
function addEntry(){ return appShell(`${pageHead('Add / Edit Time Entry','Create or update a daily time entry. Jira lookup is mocked for review.',`<button class="btn" onclick="go('timesheet')">Back</button>`)}<div class="modal-screen card"><div class="grid two"><div class="field"><label>Work Date <span class="required">*</span></label><input class="input" value="04/06/2026"/></div><div class="field"><label>Project <span class="required">*</span></label><select class="select"><option>Core CRM Project</option><option>Finance Portal</option><option>Internal Support</option></select></div><div class="field"><label>Role <span class="required">*</span></label><select class="select"><option>Developer</option><option>Tester</option><option>Business Analyst</option><option>Project Manager</option></select></div><div class="field"><label>Work Type <span class="required">*</span></label><select class="select"><option>Project</option><option>BAU</option><option>Internal</option><option>Leave</option></select></div><div class="field"><label>Task Nature <span class="required">*</span></label><select class="select"><option>Bug Fix</option><option>Development</option><option>Testing</option><option>Meeting</option></select></div><div class="field"><label>Module <span class="required">*</span></label><select class="select"><option>Billing</option><option>Login</option><option>Payment</option><option>General</option></select></div></div><br/><div class="field"><label>Jira Ticket</label><input class="input" value="payment timeout"/><div class="hint">Search by ticket number or keyword. Suggestions below are mocked.</div></div><div class="ticket-card selected"><div class="ticket-title">CRM-1023 — Payment API timeout</div><div class="ticket-meta">Status: In Progress · Project: Core CRM</div></div><div class="ticket-card"><div class="ticket-title">CRM-1038 — Billing page UI issue</div><div class="ticket-meta">Status: Open · Project: Core CRM</div></div><br/><div class="field"><label>Selected Ticket</label><input class="input" value="CRM-1023 — Payment API timeout"/></div><br/><div class="grid two"><div class="field"><label>Hours <span class="required">*</span></label><input class="input" type="number" step="0.25" value="2.5"/></div><div class="notice">The system warns when the total recorded hours for a day exceed 8 hours, but does not block submission.</div></div><br/><div class="field"><label>Description</label><textarea class="textarea">Investigated API timeout and added retry logic.</textarea></div><br/><div style="text-align:right"><button class="btn" onclick="go('timesheet')">Cancel</button> <button class="btn primary" onclick="go('timesheet')">Save Entry</button></div></div>`); }
function submit(){ return appShell(`${pageHead('Submit Timesheet','Review your weekly timesheet before submission.',`<button class="btn" onclick="go('timesheet')">Back to Edit</button>`)}<div class="card"><div class="grid four"><div><div class="hint">Employee</div><b>Chris Wong</b></div><div><div class="hint">Department</div><b>Application Development</b></div><div><div class="hint">Period</div><b>01/06/2026 - 07/06/2026</b></div><div><div class="hint">Weekly Total</div><b>38.5 Hours</b></div></div><br/><h3>Daily Summary</h3><table><thead><tr><th>Date</th><th class="num">Total Hours</th><th>Validation</th></tr></thead><tbody><tr><td>Monday, 01 Jun</td><td class="num">8.0</td><td><span class="status approved">Complete</span></td></tr><tr><td>Tuesday, 02 Jun</td><td class="num">7.5</td><td><span class="status pending">Below standard hours</span></td></tr><tr><td>Wednesday, 03 Jun</td><td class="num">8.0</td><td><span class="status approved">Complete</span></td></tr><tr><td>Thursday, 04 Jun</td><td class="num">7.0</td><td><span class="status pending">Below standard hours</span></td></tr><tr><td>Friday, 05 Jun</td><td class="num">8.0</td><td><span class="status approved">Complete</span></td></tr></tbody></table><br/><h3>Approval Route</h3><div class="route"><span class="node">Chris Wong</span><span class="arrow">→</span><span class="node">Mary Chan</span><span class="arrow">→</span><span class="node">David Lee</span></div><div class="field"><label>Submission Note</label><textarea class="textarea" placeholder="Optional note to your supervisor..."></textarea></div><br/><div style="text-align:right"><button class="btn" onclick="go('timesheet')">Back to Edit</button> <button class="btn primary" onclick="go('approvals')">Submit for Approval</button></div></div>`); }
function approvals(){ return appShell(`${pageHead('Approval Inbox','Review and approve submitted timesheets.',`<button class="btn primary" onclick="go('approval-detail')">Review Timesheet →</button>`)}<div class="card"><div style="display:flex;gap:10px"><span class="status pending">Pending Approval 12</span><span class="status approved">Approved</span><span class="status rejected">Rejected</span></div><br/><div class="grid four"><div class="field"><label>Period</label><input class="input" value="01/06/2026 - 07/06/2026"/></div><div class="field"><label>Department</label><select class="select"><option>All Departments</option><option>Application Development</option><option>QA Team</option></select></div><div class="field"><label>Employee</label><input class="input" placeholder="Search employee..."/></div><div class="field"><label>&nbsp;</label><button class="btn primary" style="width:100%;justify-content:center">Search</button></div></div><br/><table><thead><tr><th>☐</th><th>Employee</th><th>Department</th><th>Period</th><th class="num">Hours</th><th>Submitted</th><th>Status</th></tr></thead><tbody><tr onclick="go('approval-detail')"><td>☐</td><td>Chris Wong</td><td>App Development</td><td>01 Jun - 07 Jun</td><td class="num">38.5</td><td>08 Jun 09:20</td><td><span class="status pending">Pending L1</span></td></tr><tr onclick="go('approval-detail')"><td>☐</td><td>Amy Lau</td><td>App Development</td><td>01 Jun - 07 Jun</td><td class="num">40.0</td><td>08 Jun 09:42</td><td><span class="status pending">Pending L1</span></td></tr><tr onclick="go('approval-detail')"><td>☐</td><td>Jason Ho</td><td>QA Team</td><td>01 Jun - 07 Jun</td><td class="num">42.0</td><td>08 Jun 10:15</td><td><span class="status pending">Pending L1</span></td></tr></tbody></table><br/><div style="display:flex"><b>Selected: 0</b><div class="spacer"></div><button class="btn">Approve Selected</button><button class="btn primary" onclick="go('approval-detail')">Review Timesheet →</button></div></div>`); }
function approvalDetail(){ return appShell(`${pageHead('Timesheet Approval Detail','Review weekly entries and approve or reject the submitted timesheet.',`<button class="btn" onclick="go('approvals')">Back to Inbox</button>`)}<div class="card"><div class="grid four"><div><div class="hint">Employee</div><b>Chris Wong</b></div><div><div class="hint">Department</div><b>Application Development</b></div><div><div class="hint">Period</div><b>01/06/2026 - 07/06/2026</b></div><div><div class="hint">Weekly Total</div><b>38.5 Hours</b></div></div><br/><div class="progress"><div class="step done"><span class="circle">1</span>Submitted</div><div class="step current"><span class="circle">2</span>Supervisor Review</div><div class="step"><span class="circle">3</span>Second-level Review</div></div><br/><h3>Monday, 01/06/2026 <span class="pill">Total: 8.0 Hours</span></h3>${entriesTable()}<br/><div class="notice">Tuesday and Thursday are below standard working hours. Supervisor may approve or reject with comments.</div><br/><div class="field"><label>Employee Note</label><div class="input">Project support activity caused minor variation in daily hours.</div></div><br/><div class="field"><label>Approval Comment</label><textarea class="textarea" placeholder="Add a comment..."></textarea></div><br/><div style="display:flex"><button class="btn danger">Reject Timesheet</button><div class="spacer"></div><button class="btn primary" onclick="go('approvals')">Approve Timesheet</button></div></div>`); }
function report(){ return appShell(`${pageHead('Project Hours Report','Analyse approved working hours by project, team and task category.',`<button class="btn">Export Excel</button>`)}<div class="card"><div class="grid four"><div class="field"><label>Date Range</label><input class="input" value="01/06/2026 - 30/06/2026"/></div><div class="field"><label>Project</label><select class="select"><option>All Projects</option></select></div><div class="field"><label>Department</label><select class="select"><option>All Departments</option></select></div><div class="field"><label>Employee</label><input class="input" placeholder="All Employees"/></div><div class="field"><label>Module</label><select class="select"><option>All Modules</option></select></div><div class="field"><label>Work Type</label><select class="select"><option>All Types</option></select></div><div class="field"><label>Task Nature</label><select class="select"><option>All Task Natures</option></select></div><div class="field"><label>Ticket No.</label><input class="input" placeholder="Search Jira ticket..."/></div></div><br/><button class="btn primary">Apply Filters</button> <button class="btn">Reset</button></div><br/><div class="grid four"><div class="summary-stat"><div class="label">Total Approved Hours</div><div class="value">1,248.5h</div><div class="small">Jun 2026</div></div><div class="summary-stat"><div class="label">Project Hours</div><div class="value">985.0h</div><div class="small">78.9% of total</div></div><div class="summary-stat"><div class="label">Internal Hours</div><div class="value">263.5h</div><div class="small">21.1% of total</div></div><div class="summary-stat"><div class="label">Employees</div><div class="value">42</div><div class="small">Approved data only</div></div></div><br/><div class="card"><h3>Hours by Project</h3>${[['Core CRM Project',72,'520.5h'],['Finance Portal',48,'340.0h'],['Internal Support',36,'263.5h'],['Mobile App',20,'125.0h']].map(r=>`<div class="chart-row"><b>${r[0]}</b><div class="bar"><span style="width:${r[1]}%"></span></div><div>${r[2]}</div></div>`).join('')}<br/><h3>Detailed Records</h3><table><thead><tr><th>Employee</th><th>Date</th><th>Project</th><th>Module</th><th>Ticket</th><th class="num">Hours</th></tr></thead><tbody><tr><td>Chris Wong</td><td>04/06/2026</td><td>Core CRM</td><td>Billing</td><td>CRM-21</td><td class="num">4.0</td></tr><tr><td>Amy Lau</td><td>04/06/2026</td><td>Finance</td><td>Payment</td><td>FIN-83</td><td class="num">3.5</td></tr></tbody></table></div>`); }
