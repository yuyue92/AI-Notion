<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>门禁事件记录 - Demo</title>
<style>
  :root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --primary:#2f5bea;
    --primary-light:#eaf0ff;
    --border:#e5e8f0;
    --text:#1f2430;
    --muted:#8892a4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px;
  }
  .wrap{max-width:1200px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(20,30,60,0.04);
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    font-size:13px;
    color:var(--muted);
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    background:var(--primary-light);
    color:var(--primary);
    text-align:left;
    padding:10px 12px;
    white-space:nowrap;
    font-weight:600;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody tr:hover{background:#fafbff;}
  .tag{
    display:inline-block;
    padding:2px 8px;
    border-radius:6px;
    font-size:12px;
  }
  .tag-in{background:#e6f7ee;color:#18a058;}
  .tag-out{background:#fdeeee;color:#d03050;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .badge-verify{
    background:#f0f2f8;
    color:#556;
    padding:2px 8px;
    border-radius:6px;
    font-size:12px;
  }
  .rawtoggle{
    font-size:12px;
    color:var(--primary);
    cursor:pointer;
    user-select:none;
    background:none;
    border:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>门禁 / 考勤事件记录</h1>
  <div class="sub">数据来源：接口返回 JSON（字段中文原始 UTF-8 字节被误按 Latin-1 解码产生乱码，页面已在前端自动修复还原）</div>

  <div class="card">
    <div class="toolbar">
      <span id="countInfo">共 0 条记录</span>
      <span id="pageInfo"></span>
    </div>
    <table id="dataTable">
      <thead>
        <tr>
          <th>时间</th>
          <th>设备名称</th>
          <th>事件点</th>
          <th>事件描述</th>
          <th>卡号</th>
          <th>人员编号</th>
          <th>姓名</th>
          <th>部门</th>
          <th>进/出</th>
          <th>验证方式</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyTip" style="display:none;">暂无数据</div>
  </div>
</div>

<script>
// ------- 原始数据（模拟接口真实返回：中文字段的 UTF-8 字节被误按 Latin-1 解码，产生乱码） -------
const rawData = {
  "page": 7,
  "total": 20,
  "records": 979,
  "rows": [
    {
      "id": "3881021",
      "pin": "XCS00090",
      "name": "He, Zhi-Cheng",

      "TTime": "2026-07-24 09:12:50",
      "deptName": "eMPF",
      "inorout": "è¿",
      "verify": "é¢é¨&å¡",
      "event_no": "æ­£å¸¸å¼é¨",
      "Device": "FAC1252200900(eMPFæ¿-ä¸»é¨-å¤)",
      "event_point": "eMPFæ¿-ä¸»é¨-å¤"
    },
    {
      "id": "3881023",
      "pin": "82016999",
      "name": "Chivas Yin",
      "card_no": "1949595",
      "TTime": "2026-07-24 09:12:54",
      "deptName": "eMPF",
      "inorout": "è¿",
      "verify": "é¢é¨",
      "event_no": "æ­£å¸¸å¼é¨",
      "Device": "FAC1252300191(39-åé¨-å¤)",
      "event_point": "39-åé¨-å¤"
    }
  ]
};

// ------- 乱码修复：还原 s.encode('latin1').decode('utf-8') 的逆过程 -------
// 原理：mis-decode 过程是 "正确UTF-8字节 -> 误按Latin-1解码"，Latin-1 是 0~255 字节与
// Unicode 码点 U+0000~U+00FF 的一一对应、无损映射，所以只要把每个字符的码点当作原始字节，
// 再按 UTF-8 重新解码，就能100%还原（前提：字符串确实是被误解码产生的乱码）。
function fixEncoding(str) {
  if (typeof str !== 'string' || str === '') return str;
  const codePoints = [...str].map(ch => ch.codePointAt(0));
  // 若字符串中出现码点超出 0-255 的字符，说明它不是 Latin-1 误解码产生的乱码（本身就是正常文本），原样返回
  if (codePoints.some(cp => cp > 0xFF)) return str;
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.from(codePoints));
  } catch (e) {
    // 不是合法的 UTF-8 字节序列，说明原字符串本来就是正常文本，原样返回
    return str;
  }
}

function fixRow(row) {
  const fixed = {};
  for (const key in row) {
    const v = row[key];
    fixed[key] = typeof v === 'string' ? fixEncoding(v.trim()) : v;
  }
  return fixed;
}

// ------- 渲染表格 -------
function render(data) {
  const tbody = document.getElementById('tbody');
  const rows = (data.rows || []).map(fixRow);

  document.getElementById('countInfo').textContent = `共 ${rows.length} 条记录（当前页）`;
  document.getElementById('pageInfo').textContent = `第 ${data.page} 页 · 总记录数 ${data.records}`;

  if (rows.length === 0) {
    document.getElementById('emptyTip').style.display = 'block';
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const isIn = r.inorout === '进';
    const dirTag = r.inorout
      ? `<span class="tag ${isIn ? 'tag-in' : 'tag-out'}">${r.inorout}</span>`
      : '';
    const verifyTag = r.verify ? `<span class="badge-verify">${r.verify}</span>` : '';
    return `
      <tr>
        <td>${r.TTime || ''}</td>
        <td>${r.Device || ''}</td>
        <td>${r.event_point || ''}</td>
        <td>${r.event_no || ''}</td>
        <td>${r.card_no || ''}</td>
        <td>${r.pin || ''}</td>
        <td>${r.name || ''}</td>
        <td>${r.deptName || ''}</td>
        <td>${dirTag}</td>
        <td>${verifyTag}</td>
      </tr>`;
  }).join('');
}

render(rawData);
</script>
</body>
</html>
